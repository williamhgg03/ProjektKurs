<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Control</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --border: #2d313a;
    --text: #e6e8eb; --muted: #8b919c; --accent: #4f8cff; --danger: #e5484d; --ok: #3dd68c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: .05em; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  #status { color: var(--muted); font-size: 13px; }
  #status.ok::before { content: "● "; color: var(--ok); }
  #status.bad::before { content: "● "; color: var(--danger); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .motors { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  input, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  input[type=range] { padding: 0; width: 100%; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.danger { color: var(--danger); }
  button.stop {
    background: var(--danger); border-color: var(--danger); color: #fff;
    font-weight: 600; padding: 10px 20px;
  }
  button.active { border-color: var(--accent); color: var(--accent); }
  .speed { font-size: 32px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .dir { color: var(--muted); font-size: 13px; }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .pins { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .pins th, .pins td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .pins th { color: var(--muted); font-weight: 500; }
  .hi { color: var(--ok); }
  .lo { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 1.5em; }
  .note.err { color: var(--danger); }
  kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Motor Control</h1>
    <span id="status">connecting…</span>
  </header>

  <section>
    <div class="row">
      <button id="stopAll" class="stop">Stop all</button>
      <label><input id="enabled" type="checkbox"> Driver enabled (STBY)</label>
    </div>
    <div id="note" class="note"><kbd>Space</kbd> stops both motors.</div>
  </section>

  <div class="motors">
    <section data-motor="a">
      <h2>Motor A</h2>
      <div class="row" style="justify-content: space-between">
        <span class="speed">0</span><span class="dir">stopped</span>
      </div>
      <input class="slider" type="range" min="-100" max="100" step="1" value="0">
      <div class="ticks"><span>-100</span><span>0</span><span>100</span></div>
      <div class="row" style="margin-top: 12px">
        <button class="zero">Stop (coast)</button>
        <button class="brake">Brake</button>
      </div>
    </section>

    <section data-motor="b">
      <h2>Motor B</h2>
      <div class="row" style="justify-content: space-between">
        <span class="speed">0</span><span class="dir">stopped</span>
      </div>
      <input class="slider" type="range" min="-100" max="100" step="1" value="0">
      <div class="ticks"><span>-100</span><span>0</span><span>100</span></div>
      <div class="row" style="margin-top: 12px">
        <button class="zero">Stop (coast)</button>
        <button class="brake">Brake</button>
      </div>
    </section>
  </div>

  <section>
    <h2>Chip output <span id="version"></span></h2>
    <table class="pins">
      <thead><tr><th>Motor</th><th>IN1</th><th>IN2</th><th>PWM</th><th>Mode</th></tr></thead>
      <tbody id="pins"></tbody>
    </table>
    <div class="note">Pin levels the chip sets on the TB6612 from <code>/device/motors</code>.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const panels = { a: document.querySelector('[data-motor=a]'), b: document.querySelector('[data-motor=b]') };
let state = null;   // last MotorState from the server

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.json();
}

function note(msg, isErr = false) {
  $('note').textContent = msg;
  $('note').classList.toggle('err', isErr);
}

async function run(action) {
  try {
    applyState(await action());
    if ($('note').classList.contains('err')) note('');
  } catch (e) {
    note(e.message, true);
  }
}

const update = body => run(() => api('PUT', '/api/motors', body));

// Slider drags fire many events: keep at most one request in flight and
// send only the latest value once it returns.
const pending = {};
const inFlight = {};
async function sendSpeed(m, speed) {
  pending[m] = speed;
  if (inFlight[m]) return;
  inFlight[m] = true;
  while (pending[m] !== undefined) {
    const s = pending[m];
    delete pending[m];
    await update({ [m]: { speed: s } });
  }
  inFlight[m] = false;
}

function describe(m) {
  if (m.brake) return 'braking';
  if (m.speed === 0) return 'stopped';
  return m.speed > 0 ? 'forward' : 'reverse';
}

function applyState(s) {
  state = s;
  $('enabled').checked = s.enabled;
  for (const [m, el] of Object.entries(panels)) {
    const motor = s[m];
    const slider = el.querySelector('.slider');
    // Don't fight the user while their own slider updates are still being sent
    if (!inFlight[m]) slider.value = motor.speed;
    el.querySelector('.speed').textContent = motor.brake ? '—' : motor.speed;
    el.querySelector('.dir').textContent = s.enabled ? describe(motor) : 'standby';
    el.querySelector('.brake').classList.toggle('active', motor.brake);
  }
}

// Mirrors motor_driver.rs in the firmware
function pinRow(name, m, enabled) {
  const lvl = v => `<span class="${v ? 'hi' : 'lo'}">${v ? 'H' : 'L'}</span>`;
  let in1 = false, in2 = false, pwm = 0, mode = describe(m);
  if (!enabled) mode = 'standby (coast)';
  else if (m.brake) { in1 = in2 = true; }
  else if (m.speed > 0) { in1 = true; pwm = m.speed; }
  else if (m.speed < 0) { in2 = true; pwm = -m.speed; }
  return `<tr><td>${name}</td><td>${lvl(in1)}</td><td>${lvl(in2)}</td><td>${pwm}%</td><td>${mode}</td></tr>`;
}

function renderPins(s) {
  $('version').textContent = '· v' + s.version;
  $('pins').innerHTML =
    `<tr><td>STBY</td><td colspan="4">${s.enabled ? '<span class="hi">H</span> (running)' : '<span class="lo">L</span> (standby)'}</td></tr>` +
    pinRow('A', s.a, s.enabled) + pinRow('B', s.b, s.enabled);
}

for (const [m, el] of Object.entries(panels)) {
  const slider = el.querySelector('.slider');
  slider.addEventListener('input', () => {
    el.querySelector('.speed').textContent = slider.value;
    sendSpeed(m, +slider.value);
  });
  // Double click snaps back to zero
  slider.addEventListener('dblclick', () => { slider.value = 0; sendSpeed(m, 0); });
  el.querySelector('.zero').addEventListener('click', () => {
    slider.value = 0;
    sendSpeed(m, 0);
  });
  el.querySelector('.brake').addEventListener('click', () => {
    update({ [m]: { brake: !(state && state[m].brake) } });
  });
}

const stopAll = () => run(() => api('POST', '/api/motors/stop'));
$('stopAll').addEventListener('click', stopAll);
$('enabled').addEventListener('change', e => update({ enabled: e.target.checked }));
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    stopAll();
  }
});

// Long-poll the chip endpoint, exactly like the firmware does
async function pollLoop() {
  let since = null;
  for (;;) {
    try {
      const s = await api('GET', '/device/motors' + (since === null ? '' : '?since=' + since));
      $('status').className = 'ok';
      $('status').textContent = 'connected';
      if (s.version !== since) {
        since = s.version;
        renderPins(s);
        applyState(s);
      }
    } catch (e) {
      $('status').className = 'bad';
      $('status').textContent = 'disconnected';
      since = null;
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

pollLoop();
</script>
</body>
</html>

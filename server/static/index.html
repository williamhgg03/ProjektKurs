<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Strip Control</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --border: #2d313a;
    --text: #e6e8eb; --muted: #8b919c; --accent: #4f8cff; --danger: #e5484d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: .05em; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border: 1px solid transparent; border-radius: 6px; }
  nav a:hover { color: var(--text); }
  nav a[aria-current] { color: var(--text); background: var(--panel); border-color: var(--border); }
  #status { color: var(--muted); font-size: 13px; }
  #status.ok::before { content: "● "; color: #3dd68c; }
  #status.bad::before { content: "● "; color: var(--danger); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  input[type=number] { width: 80px; }
  input, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  input[type=color] { padding: 2px; width: 44px; height: 34px; }
  input[type=range] { padding: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .strip {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
    gap: 4px; margin-top: 12px; user-select: none; touch-action: none;
  }
  .led { aspect-ratio: 1; border-radius: 50%; border: 1px solid #0006; background: #000; }
  #editor .led { cursor: crosshair; }
  #preview .led { box-shadow: 0 0 8px var(--glow, transparent); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 1.5em; }
  .note.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <nav><a href="/" aria-current="page">LED strip</a><a href="/imu">IMU</a></nav>
  <header>
    <h1>LED Strip Control</h1>
    <span id="status">connecting…</span>
  </header>

  <section>
    <h2>Configuration</h2>
    <form id="config" class="row">
      <label>LEDs <input id="numLeds" type="number" min="1" max="1024" required></label>
      <label>Brightness <input id="brightness" type="range" min="0" max="255"> <span id="brightnessVal"></span></label>
      <button class="primary">Apply</button>
    </form>
  </section>

  <section>
    <h2>Editor</h2>
    <div class="row">
      <input id="color" type="color" value="#ff4000" title="Paint colour">
      <button id="send" class="primary">Send frame</button>
      <button id="fill">Fill</button>
      <button id="rainbow">Rainbow</button>
      <button id="off" class="danger">Off</button>
    </div>
    <div id="editor" class="strip"></div>
    <div id="editorNote" class="note">Click or drag across LEDs to paint them, then press Send frame.</div>
  </section>

  <section>
    <h2>Chip output <span id="version"></span></h2>
    <div id="preview" class="strip"></div>
    <div class="note">What the chip receives from <code>/device/led</code>, with brightness applied.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let state = null;     // last LedState from the server
let draft = [];       // editable frame, length num_leds
let dirty = false;    // draft has unsent changes

const toHex = c => '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
const fromHex = h => ({ r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) });
const OFF = { r: 0, g: 0, b: 0 };

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.json();
}

function note(msg, isErr = false) {
  const el = $('editorNote');
  el.textContent = msg;
  el.classList.toggle('err', isErr);
}

async function run(action, okMsg) {
  try {
    applyState(await action());
    if (okMsg) note(okMsg);
  } catch (e) {
    note(e.message, true);
  }
}

function applyState(s) {
  state = s;
  const n = s.config.num_leds;
  if (!dirty || draft.length !== n) {
    draft = Array.from({ length: n }, (_, i) => s.frame[i] || OFF);
    dirty = false;
  }
  // Don't overwrite inputs the user is currently editing
  if (document.activeElement !== $('numLeds')) $('numLeds').value = n;
  if (document.activeElement !== $('brightness')) {
    $('brightness').value = s.config.brightness;
    $('brightnessVal').textContent = s.config.brightness;
  }
  renderEditor();
}

function renderStrip(el, colors, cls = '') {
  if (el.children.length !== colors.length) {
    el.replaceChildren(...colors.map((_, i) => {
      const d = document.createElement('div');
      d.className = 'led';
      d.dataset.i = i;
      return d;
    }));
  }
  colors.forEach((c, i) => {
    const hex = toHex(c);
    el.children[i].style.background = hex;
    el.children[i].style.setProperty('--glow', hex + '99');
  });
}

function renderEditor() {
  renderStrip($('editor'), draft);
}

// Painting: click or drag
let painting = false;
function paint(e) {
  const i = e.target.dataset && e.target.dataset.i;
  if (i === undefined) return;
  draft[+i] = fromHex($('color').value);
  if (!dirty) note('Unsent changes. Press Send frame.');
  dirty = true;
  renderEditor();
}
$('editor').addEventListener('pointerdown', e => { painting = true; paint(e); });
$('editor').addEventListener('pointerover', e => { if (painting) paint(e); });
window.addEventListener('pointerup', () => { painting = false; });

$('brightness').addEventListener('input', e => { $('brightnessVal').textContent = e.target.value; });

$('config').addEventListener('submit', e => {
  e.preventDefault();
  run(() => api('PUT', '/api/led/config', {
    num_leds: +$('numLeds').value,
    brightness: +$('brightness').value,
  }), 'Configuration applied.');
});

$('send').addEventListener('click', () => {
  dirty = false;
  run(() => api('POST', '/api/led/frame', { leds: draft }), 'Frame sent.');
});
$('fill').addEventListener('click', () => {
  dirty = false;
  run(() => api('POST', '/api/led/fill', fromHex($('color').value)), 'Strip filled.');
});
$('off').addEventListener('click', () => {
  dirty = false;
  run(() => api('POST', '/api/led/off'), 'Strip turned off.');
});
$('rainbow').addEventListener('click', () => {
  const n = draft.length;
  draft = draft.map((_, i) => hsv(i / n));
  dirty = false;
  run(() => api('POST', '/api/led/frame', { leds: draft }), 'Rainbow sent.');
});

function hsv(h) {
  const f = k => {
    const x = (k + h * 6) % 6;
    return Math.round(255 * (1 - Math.max(0, Math.min(x, 4 - x, 1))));
  };
  return { r: f(5), g: f(3), b: f(1) };
}

// Long-poll the chip endpoint, exactly like the firmware will
async function pollLoop() {
  let since = null;
  for (;;) {
    try {
      const f = await api('GET', '/device/led' + (since === null ? '' : '?since=' + since));
      $('status').className = 'ok';
      $('status').textContent = 'connected';
      if (f.version !== since) {
        since = f.version;
        $('version').textContent = '· v' + f.version;
        renderStrip($('preview'), f.leds);
        applyState(await api('GET', '/api/led'));
      }
    } catch (e) {
      $('status').className = 'bad';
      $('status').textContent = 'disconnected';
      since = null;
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

pollLoop();
</script>
</body>
</html>

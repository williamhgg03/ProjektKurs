[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["mp3"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

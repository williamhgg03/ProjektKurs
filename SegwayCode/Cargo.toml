[package]
name = "SegwayCode"
version = "0.1.0"
authors = ["svenviktorm <viktormagnusson73@gmail.com>"]
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "segway"
path = "src/main.rs"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

# esp-idf-sys comes along with esp-idf-hal's git repo (it lives there now)
[patch.crates-io]
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }

[build-dependencies]
embuild = "0.33.5"
